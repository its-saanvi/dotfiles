#### Shortcuts
[shortcuts]

## Launching Apps
logo-Return             = { type = "exec", exec = { prog = "ghostty", privileged = true} }
logo-p                  = { type = "exec", exec = { prog = "wofi", args = ["-i", "--show", "drun", "--prompt", "Search for an application", "--allow-images"], privileged = true }}
logo-b                  = { type = "exec", exec = "zen-browser" }
logo-f                  = { type = "exec", exec = "nautilus" }
logo-m                  = "show-single"
logo-a                  = "show-all"

## System Actions
logo-shift-q            = "quit"
logo-q                  = "close"
logo-shift-r            = "reload-config-toml"
logo-ctrl-shift-s       = { type = "exec", exec = { shell = "$HOME/.local/bin/wofi-power-menu" } }
logo-shift-s            = { type = "exec", exec = { prog = "bash", args = ["-lc", 'grim -g "$(slurp)" - | wl-copy'], privileged = true } }
XF86AudioRaiseVolume    = { type = "exec", exec = ["wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@", "0.05+"] }
XF86AudioLowerVolume    = { type = "exec", exec = ["wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@", "0.05-"] }
XF86AudioMute           = { type = "exec", exec = ["wpctl", "set-mute", "@DEFAULT_AUDIO_SINK@", "toggle"] }


