#### Resize Mode
[shortcuts.logo-r]
type = "multi"

[[shortcuts.logo-r.actions]]
name = "resize"
type = "push-mode"

[modes.resize.shortcuts.Down]
dy2 = 100
type = "resize"

[modes.resize.shortcuts.Left]
dx1 = -100
type = "resize"

[modes.resize.shortcuts.Right]
dx2 = 100
type = "resize"

[modes.resize.shortcuts.Up]
dy1 = -100
type = "resize"

[modes.resize.shortcuts.Escape]
type = "multi"

[[modes.resize.shortcuts.Escape.actions]]
cmd = "pop-mode"
type = "simple"

[modes.resize.shortcuts.logo-r]
type = "multi"

[[modes.resize.shortcuts.logo-r.actions]]
cmd = "pop-mode"
type = "simple"


#### Inputs
[[inputs]]
tag = "mice"
match.is-pointer = true
accel-profile = "Flat"
accel-speed = -0.86


#### Monitors
[[outputs]]
name = "primary"
match.connector = "DP-4"
x = 1920
y = 0
mode = { width = 1920, height = 1080, refresh-rate = 179.961 }
tearing.mode = "never"
vrr.mode = "never"

[[outputs]]
name = "virtual"
match.connector = "VO-1"
enabled = true
x = 0 
y = 0
mode = { width = 1920, height = 1080, refresh-rate = 60.000 }

[[windows]]
match.title-regex = ".*"
action = "show-single"

[[clients]]
match.comm = "waybar"
capabilities = ["layer-shell", "foreign-toplevel-list"]
