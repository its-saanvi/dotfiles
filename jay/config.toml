repeat-rate = { rate = 190, delay = 180 }


#### Visual Features
workspace-display-order = "sorted"
show-bar = false
show-titles = true 


#### Behavior Features
middle-click-paste = false
focus-follows-mouse = false
window-management-key = "Super_L"
pointer-revert-key = "NoSymbol"
unstable-mouse-follows-focus = false 
fallback-output-mode = "focus"
use-hardware-cursor = false
explicit-sync = true

#### Startup Actions
on-graphics-initialized = [
{ type = "exec", exec = { prog = "jay", args = [ "run-privileged", "sh", "-c", "$HOME/.config/waybar/launch.sh" ], privileged = true }},
{ type = "exec", exec = { shell = "jay randr virtual-output create 1; sleep 1; wayvnc -S /tmp/wayvnc1.sock 192.168.0.189 5900 -o 'VO-1' --render-cursor & disown", privileged = true }},
{ type = "exec", exec = { prog = "mako", args = ["--default-timeout", "3000"] } },
{ type = "exec", exec = { shell = "swaybg -i $HOME/Desktop/livewall/celeste.png -o \"*\"", privileged = true } },
{ type = "exec", exec = { shell = "sleep 5 && blueman-applet", privileged = true } },
{ type = "exec", exec = { prog = "nm-applet", privileged = true } },
{ type = "exec", exec = { prog = "qpwgraph", args = ["-m"], privileged = true } },
{ type = "exec", exec = { shell = "sleep 5 && vesktop --start-minimized --ozone-platform-hint=auto", privileged = true } },
{ type = "exec", exec = { prog = "wl-paste", args = ["--type", "text", "--watch", "cliphist", "store"], privileged = true } },
{ type = "exec", exec = { prog = "wl-paste", args = ["--type", "image", "--watch", "cliphist", "store"], privileged = true } },
{ type = "exec", exec = { prog = "/usr/libexec/polkit-mate-authentication-agent-1", privileged = true } },
{ type = "show-workspace", name = "1",  output.name = "primary"  },
{ type = "show-workspace", name = "2",  output.name = "primary"  },
{ type = "show-workspace", name = "3",  output.name = "primary"  },
{ type = "show-workspace", name = "4",  output.name = "primary"  },
{ type = "show-workspace", name = "5",  output.name = "primary"  },
{ type = "show-workspace", name = "6",  output.name = "primary"  },
{ type = "show-workspace", name = "7",  output.name = "primary"  },
{ type = "show-workspace", name = "8",  output.name = "primary"  },
{ type = "show-workspace", name = "9",  output.name = "primary"  },
{ type = "show-workspace", name = "10",  output.name = "virtual"  },
{ type = "show-workspace", name = "1",  output.name = "primary"  },
]

on-startup = [
{ type = "exec", exec = { shell = "ydotoold", privileged = true }}
]

